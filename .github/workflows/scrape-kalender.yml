name: Scrape Kalender Pendidikan Jabar

on:
  schedule:
    # 01:00 WIB = 18:00 UTC hari sebelumnya
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-kalender
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Jalankan scraper
        run: python script/scrape-kalender.py

      - name: Commit hasil
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(data): update kalender pendidikan Jabar'
          file_pattern: 'data'
