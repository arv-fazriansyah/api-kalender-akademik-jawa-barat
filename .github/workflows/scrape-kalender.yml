name: Scrape Kalender Pendidikan Jabar

# API Disdik Jabar dilindungi Cloudflare dan menolak request HTTP biasa dari
# IP datacenter (runner GitHub Actions selalu kena 403 challenge).
#
# Solusinya dua lapis:
#   1. script/fetch-browser.py menjalankan Chromium sungguhan agar challenge
#      Cloudflare selesai, lalu memanggil endpoint API dari dalam halaman.
#   2. script/scrape-kalender.py memakai hasil itu sebagai cadangan saat
#      request langsung gagal.
#
# Kalau punya proxy ber-IP Indonesia, cukup set secret HTTPS_PROXY dan
# tambahkan blok schedule di bawah.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 18 * * *'   # 01.00 WIB

permissions:
  contents: write

concurrency:
  group: scrape-kalender
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ambil data lewat browser (opsional)
        continue-on-error: true
        env:
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
        run: python script/fetch-browser.py

      - name: Susun data JSON
        env:
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          TAHUN_AJARAN: ${{ vars.TAHUN_AJARAN }}
        run: python script/scrape-kalender.py

      - name: Commit hasil
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(data): update kalender pendidikan Jabar'
          file_pattern: 'data'
