name: Scrape Kalender Pendidikan Jabar

# Jadwal harian 01.00 WIB TIDAK bisa dipakai di sini.
# API Disdik Jabar dilindungi Cloudflare dan menolak (HTTP 403) permintaan dari
# IP datacenter luar negeri, termasuk runner GitHub Actions. Semua proxy publik
# dan proxy Google Translate sudah diuji dan gagal.
#
# Scrape harian dijalankan di mesin ber-IP Indonesia lewat:
#   script/run-daily.ps1  +  script/register-task.ps1  (Windows Task Scheduler)
#
# Workflow ini disisakan untuk dijalankan manual, atau otomatis kalau nanti
# memakai proxy Indonesia:
#   set secret HTTPS_PROXY lalu tambahkan blok schedule di bawah.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-kalender
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Jalankan scraper
        env:
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          TAHUN_AJARAN: ${{ vars.TAHUN_AJARAN }}
        run: python script/scrape-kalender.py

      - name: Commit hasil
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(data): update kalender pendidikan Jabar'
          file_pattern: 'data'
