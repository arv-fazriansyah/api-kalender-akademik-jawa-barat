name: Scrape Kalender Pendidikan Jabar

# API Disdik Jabar dilindungi Cloudflare dan menolak request dari IP datacenter
# (runner GitHub Actions kena 403). Script otomatis mencari proxy gratis ber-IP
# Indonesia lalu mencobanya sampai ada yang berhasil.
#
# Kalau punya proxy tetap, set secret PROXY atau HTTPS_PROXY.

on:
  schedule:
    # 01.00 WIB = 18.00 UTC hari sebelumnya
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-kalender
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Jalankan scraper
        env:
          PROXY: ${{ secrets.PROXY }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          TAHUN_AJARAN: ${{ vars.TAHUN_AJARAN }}
        run: python script/scrape-kalender.py

      - name: Commit hasil
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(data): update kalender pendidikan Jabar'
          file_pattern: 'data'
